# Free public walk URL for look-dev.
# https://klnkv.github.io/klnkv-hospital-tregubenko/
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Prepare Pages artifact
        run: |
          set -e
          ROOT=dist-pages
          test -d "$ROOT"
          touch "$ROOT/.nojekyll"
          cp "$ROOT/index.html" "$ROOT/404.html"
          mkdir -p _site
          cp -a "$ROOT"/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
